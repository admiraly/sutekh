name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Validate specs and examples
        run: python tools/validate_pack.py --check-report
      - name: Run validator regression tests
        run: python -I tests/tools/test_validate_pack.py
      # The broker runs on Linux only: tools/broker/broker.py imports fcntl and resource and
      # relies on POSIX process groups (start_new_session, killpg) and RLIMIT_AS, none of which
      # exist on Windows. Porting it is a feature, not a fix, so this step stays Linux-only.
      - name: Run broker, BFME registry and bench client tests
        if: runner.os == 'Linux'
        run: |
          python -I tests/broker/test_broker.py
          python -I tests/bfme/test_registry.py
          python -I tests/bench/test_ir02_stderr.py
      - name: Check repository licensing
        run: python tools/check_repository_license.py

  gcc16:
    name: Linux GCC 16.2 -Werror
    runs-on: ubuntu-latest
    # The newest GCC release series (16.x point release) under the repository's -Werror policy, renderer and glTF
    # importer included; lavapipe draws the render tests.
    container:
      image: gcc:16.2
      # the containment test installs its own seccomp filter and probes io_uring: Docker's default profile would be a
      # second filter and blocks io_uring, so the container runs without it (the runner VM is the isolation)
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # SDL 3 (opened at run time by su_window) and Xvfb: the window and swapchain tests run on an X server with
      # lavapipe presenting through VK_KHR_xlib_surface.
      - name: Install build tools, Python, a CPU Vulkan driver, SDL 3 and Xvfb
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv mesa-vulkan-drivers libvulkan1 git libsdl3-0 xvfb xauth
          python3 -m venv /opt/venv
          /opt/venv/bin/python -m pip install -r tools/requirements-dev.txt
          gcc --version
      - name: Configure, build and test with GCC 16
        run: |
          export PATH=/opt/venv/bin:$PATH
          python tools/bootstrap_vulkan_headers.py
          python tools/bootstrap_asset_deps.py
          python tools/bootstrap_sdl3_headers.py
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release -DSUTEKH_NATIVE=OFF -DSUTEKH_RENDER=ON -DSUTEKH_ASSET_IMPORT=ON
          # -k 0: report every file that fails, not just the first
          cmake --build build -j 2 -- -k 0
          ctest --test-dir build --output-on-failure -j 2
          # The demo's offscreen digest in the log (demo_offscreen_rollback enforces the pinned value)
          build/space_demo --offscreen build/space_demo_ci.ppm --frames 240 --rollback-check | grep -E '^(digest|shadow world|frames drawn)'

  runtime:
    name: Linux checked runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      # The optional renderer (src/render) needs the pinned Vulkan headers; Mesa's lavapipe (a CPU Vulkan driver)
      # lets render_offscreen draw and check pixels without a GPU.
      - name: Fetch pinned Vulkan headers and install a CPU Vulkan driver
        run: |
          python tools/bootstrap_vulkan_headers.py
          python tools/bootstrap_asset_deps.py
          python tools/bootstrap_sdl3_headers.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
      - name: Configure checked reference runtime
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSUTEKH_NATIVE=OFF -DSUTEKH_RENDER=ON -DSUTEKH_ASSET_IMPORT=ON
      - name: Build runtime and test executables
        run: cmake --build build -j 2
      - name: Run runtime regression suite
        run: ctest --test-dir build --output-on-failure -j 2
        env:
          SUTEKH_REQUIRE_VALIDATION: '1'
      - name: Run runtime regression suite on the reference VM tier
        # The planned VM tier is the default; this keeps the reference interpreter covered end to end.
        run: ctest --test-dir build --output-on-failure -j 2
        env:
          SUTEKH_VM_TIER: reference

  consumer:
    name: Submodule consumer (add_subdirectory, CMake 3.21.4 and 4.3)
    runs-on: ubuntu-latest
    # tests/consumer includes Sutekh with add_subdirectory and checks that ctest lists only its own tests, that an
    # engine-internal header does not compile from consumer code, that Sutekh::host links and runs, that engine
    # headers arrive as SYSTEM includes, and that the Sutekh checkout is not written to. Run with the declared minimum
    # CMake and with the pinned current one; third-party headers are fetched outside the checkout (--dest), and the
    # renderer uses the distribution's Vulkan headers (the system fallback).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CMake 3.21.4 (declared minimum), the pinned CMake and Ninja, and system Vulkan headers
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python -m venv "$RUNNER_TEMP/cmake-min"
          "$RUNNER_TEMP/cmake-min/bin/python" -m pip install cmake==3.21.4
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev
      - name: Fetch third-party headers outside the checkout
        run: |
          python tools/bootstrap_sdl3_headers.py --dest "$RUNNER_TEMP/deps"
          python tools/bootstrap_asset_deps.py --dest "$RUNNER_TEMP/deps"
      - name: Consumer with CMake 3.21.4 (Debug)
        run: >-
          python -I tests/consumer/check_consumer.py --cmake "$RUNNER_TEMP/cmake-min/bin/cmake"
          --build "$RUNNER_TEMP/consumer-min" -- -DSUTEKH_DEPS_DIR="$RUNNER_TEMP/deps" -DSUTEKH_RENDER=ON
      - name: Consumer with the pinned CMake (Ninja, Release)
        run: >-
          python -I tests/consumer/check_consumer.py --config Release --build "$RUNNER_TEMP/consumer-current"
          -- -G Ninja -DSUTEKH_DEPS_DIR="$RUNNER_TEMP/deps" -DSUTEKH_RENDER=ON
      - name: The checkout is unchanged (tracked, untracked and ignored files)
        run: |
          git status --porcelain --ignored
          test -z "$(git status --porcelain --ignored)"

  runtime-native:
    name: Linux native tier (AsmJit, SUTEKH_NATIVE=ON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Fetch and verify the pinned AsmJit commit
        run: |
          python tools/bootstrap_asmjit.py
          python tools/bootstrap_asmjit.py --check
          git diff --exit-code third_party/asmjit.lock.json
      - name: Configure native tier
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSUTEKH_NATIVE=ON
      - name: Build runtime, native backend and test executables
        run: cmake --build build -j 2
      - name: Run runtime and native regression suite
        run: ctest --test-dir build --output-on-failure -j 2

  runtime-windows:
    name: Windows checked runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      # The runner's LLVM clang targets x86_64-pc-windows-msvc and finds the installed MSVC libraries and
      # Windows SDK itself; cmake and ninja come from the pinned requirements.
      # The renderer is compiled; render_offscreen skips (exit 77) when the runner has no usable Vulkan device.
      - name: Fetch pinned Vulkan headers and the asset importer's single-file libraries
        run: |
          python tools/bootstrap_vulkan_headers.py
          python tools/bootstrap_asset_deps.py
      - name: Configure checked reference runtime
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DSUTEKH_NATIVE=OFF -DSUTEKH_RENDER=ON -DSUTEKH_ASSET_IMPORT=ON
      - name: Build runtime and test executables
        run: cmake --build build -j 2
      - name: Run runtime regression suite
        run: ctest --test-dir build --output-on-failure -j 2

  runtime-windows-msvc:
    name: Windows MSVC cl /W4 /WX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      # MSVC's cl (from the runner's Visual Studio, environment imported from vcvars64.bat), the whole default build
      # (renderer off, native tier off) at the repository warning level /W4 /WX, then the full suite.
      - name: Configure, build and test with cl
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2]) } }
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_BUILD_TYPE=Debug -DSUTEKH_NATIVE=OFF -DSUTEKH_RENDER=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build -j 2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --test-dir build --output-on-failure -j 2
          if ($LASTEXITCODE -ne 0) { exit 1 }
