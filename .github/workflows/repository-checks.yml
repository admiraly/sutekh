name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Validate specs and examples
        run: python tools/validate_pack.py --check-report
      - name: Run validator regression tests
        run: python -I tests/tools/test_validate_pack.py
      # The broker runs on Linux only: tools/broker/broker.py imports fcntl and resource and
      # relies on POSIX process groups (start_new_session, killpg) and RLIMIT_AS, none of which
      # exist on Windows. Porting it is a feature, not a fix, so this step stays Linux-only.
      - name: Run broker, BFME registry and bench client tests
        if: runner.os == 'Linux'
        run: |
          python -I tests/broker/test_broker.py
          python -I tests/bfme/test_registry.py
          python -I tests/bench/test_ir02_stderr.py
      - name: Check repository licensing
        run: python tools/check_repository_license.py

  runtime:
    name: Linux checked runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Configure checked reference runtime
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSUTEKH_NATIVE=OFF
      - name: Build runtime and test executables
        run: cmake --build build -j 2
      - name: Run runtime regression suite
        run: ctest --test-dir build --output-on-failure -j 2
