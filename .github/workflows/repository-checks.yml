name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Validate specs and examples
        run: python tools/validate_pack.py --check-report
      - name: Run validator regression tests
        run: python -I tests/tools/test_validate_pack.py
      # The broker runs on Linux only: tools/broker/broker.py imports fcntl and resource and
      # relies on POSIX process groups (start_new_session, killpg) and RLIMIT_AS, none of which
      # exist on Windows. Porting it is a feature, not a fix, so this step stays Linux-only.
      - name: Run broker, BFME registry and bench client tests
        if: runner.os == 'Linux'
        run: |
          python -I tests/broker/test_broker.py
          python -I tests/bfme/test_registry.py
          python -I tests/bench/test_ir02_stderr.py
      - name: Check repository licensing
        run: python tools/check_repository_license.py

  gcc16:
    name: Linux GCC 16.2 -Werror
    runs-on: ubuntu-latest
    # The newest GCC release series (16.x point release) under the repository's -Werror policy, renderer and glTF
    # importer included; lavapipe draws the render tests.
    container:
      image: gcc:16.2
      # the containment test installs its own seccomp filter and probes io_uring: Docker's default profile would be a
      # second filter and blocks io_uring, so the container runs without it (the runner VM is the isolation)
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools, Python and a CPU Vulkan driver
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv mesa-vulkan-drivers libvulkan1 git
          python3 -m venv /opt/venv
          /opt/venv/bin/python -m pip install -r tools/requirements-dev.txt
          gcc --version
      - name: Configure, build and test with GCC 16
        run: |
          export PATH=/opt/venv/bin:$PATH
          python tools/bootstrap_vulkan_headers.py
          python tools/bootstrap_asset_deps.py
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release -DSUTEKH_NATIVE=OFF -DSUTEKH_RENDER=ON -DSUTEKH_ASSET_IMPORT=ON
          # -k 0: report every file that fails, not just the first
          cmake --build build -j 2 -- -k 0
          ctest --test-dir build --output-on-failure -j 2

  runtime:
    name: Linux checked runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      # The optional renderer (src/render) needs the pinned Vulkan headers; Mesa's lavapipe (a CPU Vulkan driver)
      # lets render_offscreen draw and check pixels without a GPU.
      - name: Fetch pinned Vulkan headers and install a CPU Vulkan driver
        run: |
          python tools/bootstrap_vulkan_headers.py
          python tools/bootstrap_asset_deps.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
      - name: Configure checked reference runtime
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSUTEKH_NATIVE=OFF -DSUTEKH_RENDER=ON -DSUTEKH_ASSET_IMPORT=ON
      - name: Build runtime and test executables
        run: cmake --build build -j 2
      - name: Run runtime regression suite
        run: ctest --test-dir build --output-on-failure -j 2
        env:
          SUTEKH_REQUIRE_VALIDATION: '1'
      - name: Run runtime regression suite on the reference VM tier
        # The planned VM tier is the default; this keeps the reference interpreter covered end to end.
        run: ctest --test-dir build --output-on-failure -j 2
        env:
          SUTEKH_VM_TIER: reference

  runtime-native:
    name: Linux native tier (AsmJit, SUTEKH_NATIVE=ON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Fetch and verify the pinned AsmJit commit
        run: |
          python tools/bootstrap_asmjit.py
          python tools/bootstrap_asmjit.py --check
          git diff --exit-code third_party/asmjit.lock.json
      - name: Configure native tier
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSUTEKH_NATIVE=ON
      - name: Build runtime, native backend and test executables
        run: cmake --build build -j 2
      - name: Run runtime and native regression suite
        run: ctest --test-dir build --output-on-failure -j 2

  runtime-windows:
    name: Windows checked runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      # The runner's LLVM clang targets x86_64-pc-windows-msvc and finds the installed MSVC libraries and
      # Windows SDK itself; cmake and ninja come from the pinned requirements.
      # The renderer is compiled; render_offscreen skips (exit 77) when the runner has no usable Vulkan device.
      - name: Fetch pinned Vulkan headers and the asset importer's single-file libraries
        run: |
          python tools/bootstrap_vulkan_headers.py
          python tools/bootstrap_asset_deps.py
      - name: Configure checked reference runtime
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DSUTEKH_NATIVE=OFF -DSUTEKH_RENDER=ON -DSUTEKH_ASSET_IMPORT=ON
      - name: Build runtime and test executables
        run: cmake --build build -j 2
      - name: Run runtime regression suite
        run: ctest --test-dir build --output-on-failure -j 2

  runtime-windows-msvc:
    name: Windows MSVC cl /W4 /WX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      # MSVC's cl (from the runner's Visual Studio, environment imported from vcvars64.bat), the whole default build
      # (renderer off, native tier off) at the repository warning level /W4 /WX, then the full suite.
      - name: Configure, build and test with cl
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2]) } }
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_BUILD_TYPE=Debug -DSUTEKH_NATIVE=OFF -DSUTEKH_RENDER=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build -j 2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --test-dir build --output-on-failure -j 2
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Determinism matrix (docs/DETERMINISM_MATRIX.md, issue #141): the same workloads on optimized builds of each
  # compiler and OS, every tier the build has, each compared with the committed expectation
  # tests/determinism/expected_digests.txt; the manifests and Linux GCC's replays are kept for the cross-build steps.
  determinism-linux:
    name: Determinism matrix, Linux ${{ matrix.cc }} Release (native tier)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies and fetch the pinned AsmJit commit
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/bootstrap_asmjit.py
          ${{ matrix.cc }} --version
      - name: Configure and build the matrix targets
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=Release -DSUTEKH_NATIVE=ON -DSUTEKH_RENDER=OFF
          cmake --build build -j 2 --target det_matrix det_matrix_dll test_det_regress racer_microcosm sutekh
      - name: Run the determinism tests (reference, planned and native tiers, DLL, regression fixtures, RTS engine)
        run: ctest --test-dir build --output-on-failure -j 2 -R "^determinism_"
      - name: Write manifests and replays
        run: |
          mkdir -p det-out/replays
          for t in reference planned native; do
            build/det_matrix --fixtures build/det_fixtures --tier $t --out det-out/linux-${{ matrix.cc }}-$t.txt --replay-dir det-out/replays
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: det-linux-${{ matrix.cc }}
          path: det-out

  determinism-windows:
    name: Determinism matrix, Windows ${{ matrix.name }} Release
    needs: determinism-linux
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # LLVM clang targeting x86_64-pc-windows-msvc (MSVC headers, libraries and UCRT), VM tiers.
          - name: clang
            cc: clang
            native: 'OFF'
          # The same with the native tier (AsmJit, Win64 calling convention).
          - name: clang native
            cc: clang
            native: 'ON'
          # MSVC cl (environment from vcvars64.bat), VM tiers.
          - name: MSVC cl
            cc: cl
            native: 'OFF'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies and fetch the pinned AsmJit commit
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/bootstrap_asmjit.py
      - name: Configure, build and run the determinism tests
        shell: pwsh
        run: |
          if ("${{ matrix.cc }}" -eq "cl") {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2]) } }
            $cxx = "cl"
          } else {
            $cxx = "clang++"
          }
          & ${{ matrix.cc }} --version
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} "-DCMAKE_CXX_COMPILER=$cxx" -DCMAKE_BUILD_TYPE=Release -DSUTEKH_NATIVE=${{ matrix.native }} -DSUTEKH_RENDER=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build -j 2 --target det_matrix det_matrix_dll test_det_regress racer_microcosm sutekh
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --test-dir build --output-on-failure -j 2 -R "^determinism_"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: det-linux-gcc
          path: det-linux-gcc
      - name: Play the Linux GCC replays on this build, write manifests
        shell: bash
        run: |
          tag=$(echo "${{ matrix.name }}" | tr ' ' '-')
          tiers="reference planned"
          if [ "${{ matrix.native }}" = "ON" ]; then tiers="$tiers native"; fi
          mkdir -p det-out
          for t in $tiers; do
            build/det_matrix --fixtures build/det_fixtures --tier $t --play-dir det-linux-gcc/replays
            build/det_matrix --fixtures build/det_fixtures --tier $t --out det-out/windows-$tag-$t.txt
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: det-windows-${{ strategy.job-index }}
          path: det-out

  determinism-compare:
    name: Determinism matrix, every manifest against the expectation
    needs: [determinism-linux, determinism-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: det-*
          path: det
      - name: Compare
        run: python3 -I tests/determinism/compare_manifests.py tests/determinism/expected_digests.txt $(find det -name '*.txt' | sort)
